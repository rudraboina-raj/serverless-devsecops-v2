name: TechMart Enterprise CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: serverless-repo

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # Authenticate to Google Cloud
      # ============================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true

      # ============================================================
      # Setup gcloud
      # ============================================================

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # ============================================================
      # Configure Docker
      # ============================================================

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # ============================================================
      # Setup Docker Buildx
      # ============================================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # Setup Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # Install Python Quality Tools
      # ============================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pytest

      # ============================================================
      # Code Quality
      # ============================================================

      - name: Black Formatting Check
        run: black --check .

      - name: Flake8 Lint
        run: flake8 .

      - name: Run Tests
        run: pytest

      # ============================================================
      # Build Employee Service
      # ============================================================

      - name: Build Employee Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/employee-service:latest
          build-args: |
            SERVICE_NAME=employee_service

      # ============================================================
      # Build Product Service
      # ============================================================

      - name: Build Product Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/product-service:latest
          build-args: |
            SERVICE_NAME=product_service

      # ============================================================
      # Build Order Service
      # ============================================================

      - name: Build Order Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/order-service:latest
          build-args: |
            SERVICE_NAME=order_service

      # ============================================================
      # Build Payment Service
      # ============================================================

      - name: Build Payment Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/payment-service:latest
          build-args: |
            SERVICE_NAME=payment_service

      # ============================================================
      # Build Notification Service
      # ============================================================

      - name: Build Notification Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/notification-service:latest
          build-args: |
            SERVICE_NAME=notification_service

      # ============================================================
      # Deployment Trigger
      # ============================================================

      - name: Build Complete
        run: |
          echo "=============================================="
          echo "TechMart CI/CD Build Completed"
          echo "=============================================="
          echo "Employee Service     : Built and pushed"
          echo "Product Service      : Built and pushed"
          echo "Order Service        : Built and pushed"
          echo "Payment Service      : Built and pushed"
          echo "Notification Service : Built and pushed"
          echo "=============================================="